name: Actualizar normativa y noticias del SII

on:
  schedule:
    - cron: '0 12 * * 1'      # cada lunes: UTM nuevas y circulares y resoluciones de la semana
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite-node robot/actualizar-normativa.ts
      - name: Guardar y publicar si cambió
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/normativa.json public/noticias.json
          if git diff --cached --quiet; then echo 'Sin cambios'; exit 0; fi
          git config user.name 'actualizador-normativa'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Normativa y noticias del SII'
          git push
          gh workflow run pages.yml --ref main
